<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Folk of Edgewood — RC Projects</title>
<link rel="stylesheet" href="../../assets/library.css">
<link rel="stylesheet" href="edgewood.css">
<!-- ============================================================
     THE FOLK OF EDGEWOOD — the book of portraits in the hallway.
     You never need to edit this file. The characters live in the
     characters folder, one plain-text file each:

       characters/list.md          who is in the book, group by group, in order
       characters/cal-weston.md    one character
       characters/cal-weston.jpg   their picture

     The pages of ovals build themselves from those files.
     ============================================================ -->
</head>
<body class="book-page" style="--leather:#4E2A1E;--page:#F2E8D2" data-realm-name="Edgewood">

<header class="top-bar">
  <a href="index.html">&#8592; BACK TO THE HOUSE</a>
  <span class="realm-name">The Folk of Edgewood</span>
  <span class="bar-right"><button type="button" class="sound-toggle" id="soundToggle">SOUND: ON</button></span>
</header>

<div class="stage">
  <div id="book">

    <!-- ========== FRONT COVER ========== -->
    <div class="page cover" data-density="hard">
      <div class="page-inner">
        <img class="logo-cover" src="../../assets/img/rc-edgewood.png" alt="">
        <div class="cover-title">THE FOLK OF EDGEWOOD</div>
        <div class="cover-sub">the faces along the hallway</div>
      </div>
    </div>

    <!-- ========== ENDPAPER : the Contents write themselves here ========== -->
    <div class="page">
      <div class="page-inner endpaper">
        <div class="ep-head">
          <div class="ep-ident">
            <img class="ep-emblem" src="../../assets/img/rc-edgewood.png" alt="">
            <div class="ep-name">The Folk of Edgewood</div>
          </div>
          <div class="ep-epigraph">Everyone here has a story.<br>Touch a face, and they will tell you theirs.</div>
        </div>
        <h2 class="toc-heading">Contents</h2>
        <nav class="toc" id="tocList"></nav>
        <p class="small-note ep-note">~ touch a portrait to meet them ~</p>
      </div>
    </div>

    <!-- the pages of portraits are built here, from the characters below -->

    <!-- ========== BACK COVER ========== -->
    <div class="page cover" data-density="hard">
      <div class="page-inner">
        <img class="logo-back emb-cream" src="../../assets/img/rc-logo.png" alt="">
        <div class="cover-sub">rcprojects.net</div>
      </div>
    </div>

  </div>
</div>

<!-- the characters are read from the characters folder, and placed here, unseen -->
<div id="folk" hidden></div>

<script src="../../assets/markdown.js"></script>
<script src="folk.js"></script>
<script src="characters.js"></script>
<script src="../../assets/vendor/page-flip.browser.js"></script>
<script src="../../assets/library.js"></script>
</body>
</html>
