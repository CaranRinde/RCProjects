<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lectern — RC Projects</title>
<meta name="description" content="The Lectern: a scholar's study holding the degrees, research, publications, conferences and CV of Caran.">
<link rel="stylesheet" href="../../assets/library.css">
<!-- ============================================================
     THE LECTERN — a room, not a page.
     The look comes from  assets/library.css   (shared by every room)
     The behaviour from   assets/rooms.js      (shared by every room)
     This file holds only what is special to the Lectern:
     the picture, where the objects are, and your words.

     CARAN'S EDITING LEGEND

     PART ONE — THE OBJECTS (inside <div class="room-view">)
     One clickable object = one line:
       <button class="spot" data-opens="cv" style="left:..%;top:..%;width:..%;height:..%">The CV</button>
     - the words between the tags are the name shown on hover
     - data-opens="cv" opens the panel further down that has id="cv"
     - data-book="publications.html" opens that book over the room instead
     - left / top / width / height place it on the picture, in % of the
       picture's width and height (left 50% = halfway across)
     - data-sound="paper" or "wood" chooses the sound
     - data-shape="round" makes the glow round

     PART TWO — YOUR WORDS
     The words of every card live in the words folder, one plain-text file each:
       words/cv.md, words/degree-1.md ... words/degree-8.md, words/research.md,
       words/teaching.md, words/now-and-next.md, words/extended-cv.md
     The two books have their own folders: publications/ and conferences/
     (each with a list.md saying what is in the book, in order).
     Edit those files; this one only says what is where on the picture.
     ============================================================ -->
</head>
<body style="--page:#EFEBDB">

<header class="top-bar">
  <a href="../../index.html">&#8592; RETURN TO THE MAP</a>
  <span class="realm-name">The Lectern</span>
  <span class="bar-right">
    <a href="#cv">CV</a>

<!-- data-dust="left top right bottom": where the window light falls, in % of the picture -->

    <button class="spot" data-opens="degree-6" style="left:44.3%;top:34.0%;width:6.6%;height:15.9%">Sixth degree</button>

    <button class="spot" data-opens="cv" style="left:47.6%;top:73.0%;width:12.6%;height:9.4%">Curriculum vitae</button>
    <button class="spot" data-opens="now-and-next" style="left:64.6%;top:71.6%;width:17.2%;height:12.8%">Now and next</button>
    <a class="spot" href="../../index.html" data-sound="wood" style="left:92.0%;top:13.0%;width:8.0%;height:70.5%">Back to the map</a>

    <!-- ===== THE HIDDEN RED CIRCLE (no name: it has to be found) ===== -->

  </div>
  <p class="room-hint">~ whatever catches the light will open ~</p>
